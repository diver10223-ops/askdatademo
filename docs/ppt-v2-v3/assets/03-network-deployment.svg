<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.n{font-size:28px;font-weight:700;fill:#17745f}.t{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#667085}.zoneTitle{font-size:27px;font-weight:700}.b{font-size:22px;font-weight:700}.sm{font-size:18px;fill:#596579}.tiny{font-size:16px;fill:#667085}.zone{fill:#f8fafc;stroke:#a8b4c4;stroke-width:1.5}.bank{fill:#f2f8f6;stroke:#17745f;stroke-width:2.2}.card{fill:#fff;stroke:#17745f;stroke-width:1.6}.blue{fill:#eef4fa;stroke:#5c91c8;stroke-width:1.6}.orange{fill:#fff4ed;stroke:#f47c3c;stroke-width:1.6}.cloud{fill:#f7f9fb;stroke:#76869a;stroke-width:1.6;stroke-dasharray:8 6}.line{stroke:#17745f;stroke-width:2.2;fill:none}.out{stroke:#f47c3c;stroke-width:2.2;fill:none}.dash{stroke-dasharray:7 6}.divider{stroke:#a8b4c4;stroke-width:1.4;stroke-dasharray:7 6}
  </style>
  <defs>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#17745f"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#f47c3c"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="58" y="48" class="n">10</text>
  <text x="58" y="95" class="t">银行网络部署拓扑（内外部大模型双模式）</text>
  <text x="58" y="128" class="sub">数据源与查询执行始终位于银行内网；大模型可内网部署，也可经安全出口受控调用外部服务</text>
  <line x1="58" y1="151" x2="1542" y2="151" class="line"/>

  <!-- Internet -->
  <rect x="48" y="178" width="250" height="575" rx="14" class="zone"/>
  <text x="73" y="216" class="zoneTitle">互联网 / 外部网络</text>
  <rect x="78" y="258" width="190" height="85" rx="10" class="blue"/>
  <text x="173" y="291" text-anchor="middle" class="b">业务用户</text>
  <text x="173" y="319" text-anchor="middle" class="sm">浏览器 · 企业入口</text>
  <rect x="78" y="515" width="190" height="110" rx="10" class="cloud"/>
  <text x="173" y="551" text-anchor="middle" class="b">外部大模型服务</text>
  <text x="173" y="580" text-anchor="middle" class="sm">银行批准的模型 API</text>
  <text x="173" y="605" text-anchor="middle" class="tiny">仅接收最小化 / 脱敏上下文</text>

  <!-- DMZ -->
  <rect x="326" y="178" width="275" height="575" rx="14" class="zone"/>
  <text x="351" y="216" class="zoneTitle">DMZ / 安全接入区</text>
  <rect x="363" y="258" width="200" height="92" rx="10" class="orange"/>
  <text x="463" y="291" text-anchor="middle" class="b">统一接入网关</text>
  <text x="463" y="320" text-anchor="middle" class="sm">WAF · TLS · SSO · 限流</text>
  <rect x="363" y="500" width="200" height="130" rx="10" class="orange"/>
  <text x="463" y="535" text-anchor="middle" class="b">模型安全出口</text>
  <text x="463" y="565" text-anchor="middle" class="sm">代理 · 白名单 · TLS</text>
  <text x="463" y="590" text-anchor="middle" class="sm">脱敏 · DLP · 内容审查</text>
  <text x="463" y="615" text-anchor="middle" class="tiny">请求 / 响应全量审计</text>

  <!-- Bank internal network -->
  <rect x="630" y="178" width="922" height="575" rx="14" class="bank"/>
  <text x="655" y="216" class="zoneTitle">银行内部网络（生产区）</text>
  <line x1="1112" y1="236" x2="1112" y2="724" class="divider"/>
  <text x="655" y="250" class="sm">应用服务区</text>
  <text x="1137" y="250" class="sm">数据与模型区</text>

  <rect x="665" y="276" width="205" height="86" rx="10" class="blue"/>
  <text x="768" y="309" text-anchor="middle" class="b">前端 / 门户服务</text>
  <text x="768" y="337" text-anchor="middle" class="sm">用户端 · 管理端</text>
  <rect x="907" y="276" width="170" height="86" rx="10" class="blue"/>
  <text x="992" y="309" text-anchor="middle" class="b">平台服务</text>
  <text x="992" y="337" text-anchor="middle" class="sm">API · 权限 · 审计</text>
  <rect x="665" y="420" width="205" height="102" rx="10" class="card"/>
  <text x="768" y="455" text-anchor="middle" class="b">智能执行服务</text>
  <text x="768" y="484" text-anchor="middle" class="sm">语义编排 · SQL 安全</text>
  <text x="768" y="508" text-anchor="middle" class="tiny">结果校验 · 回答生成</text>
  <rect x="907" y="420" width="170" height="102" rx="10" class="card"/>
  <text x="992" y="455" text-anchor="middle" class="b">运行支撑</text>
  <text x="992" y="484" text-anchor="middle" class="sm">缓存 · 队列 · 配置</text>
  <text x="992" y="508" text-anchor="middle" class="tiny">监控 · 日志 · Trace</text>
  <rect x="786" y="585" width="205" height="92" rx="10" class="orange"/>
  <text x="889" y="620" text-anchor="middle" class="b">模型适配与路由</text>
  <text x="889" y="650" text-anchor="middle" class="sm">内外模型统一接口 · 策略选择</text>

  <rect x="1147" y="276" width="170" height="86" rx="10" class="blue"/>
  <text x="1232" y="309" text-anchor="middle" class="b">平台数据库</text>
  <text x="1232" y="337" text-anchor="middle" class="sm">配置 · 运行 · 审计</text>
  <rect x="1343" y="276" width="170" height="86" rx="10" class="card"/>
  <text x="1428" y="309" text-anchor="middle" class="b">内部数据源</text>
  <text x="1428" y="337" text-anchor="middle" class="sm">业务库 · 数仓 · 湖仓</text>
  <rect x="1147" y="420" width="366" height="102" rx="10" class="card"/>
  <text x="1330" y="455" text-anchor="middle" class="b">数据访问控制</text>
  <text x="1330" y="484" text-anchor="middle" class="sm">专用只读账号 · 白名单 · 行列权限</text>
  <text x="1330" y="508" text-anchor="middle" class="tiny">SQL 审核 / 限时 / 限量，原始数据不出内网</text>
  <rect x="1147" y="585" width="366" height="92" rx="10" class="blue"/>
  <text x="1330" y="620" text-anchor="middle" class="b">内部大模型服务（可选）</text>
  <text x="1330" y="650" text-anchor="middle" class="sm">私有化模型 · 内部 MaaS · GPU 资源池</text>

  <!-- Main traffic -->
  <path d="M268 300H363" class="line" marker-end="url(#greenArrow)"/>
  <path d="M563 304H665" class="line" marker-end="url(#greenArrow)"/>
  <path d="M870 319H907" class="line" marker-end="url(#greenArrow)"/>
  <path d="M992 362V420" class="line" marker-end="url(#greenArrow)"/>
  <path d="M907 471H870" class="line" marker-end="url(#greenArrow)"/>
  <path d="M870 449L1147 319" class="line" marker-end="url(#greenArrow)"/>
  <path d="M870 485H1147" class="line" marker-end="url(#greenArrow)"/>
  <path d="M1317 319H1343" class="line" marker-end="url(#greenArrow)"/>
  <path d="M1330 420V362" class="line" marker-end="url(#greenArrow)"/>
  <path d="M768 522L837 585" class="line" marker-end="url(#greenArrow)"/>
  <path d="M991 631H1147" class="line" marker-end="url(#greenArrow)"/>
  <text x="1038" y="619" class="tiny">模式 A：内网调用</text>

  <!-- External model controlled route -->
  <path d="M786 631H563" class="out" marker-end="url(#orangeArrow)"/>
  <path d="M363 565H268" class="out" marker-end="url(#orangeArrow)"/>
  <path d="M268 590H363" class="out dash" marker-end="url(#orangeArrow)"/>
  <path d="M563 590H786" class="out dash" marker-end="url(#orangeArrow)"/>
  <text x="610" y="613" class="tiny" fill="#f47c3c">模式 B：受控外部调用</text>
  <text x="302" y="477" class="tiny">唯一批准的外联通道</text>

  <rect x="72" y="785" width="1456" height="72" rx="12" class="orange"/>
  <text x="800" y="815" text-anchor="middle" class="b">安全边界：内部数据源与 SQL 执行不出银行内网；外部模型不得直连数据库</text>
  <text x="800" y="842" text-anchor="middle" class="sm">外部调用仅传递经过策略校验的最小必要上下文，响应回到内网后再与查询事实合成；最终拓扑以银行安全评审为准</text>
</svg>
