<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.b{font-size:24px;fill:#5d687a}.card{fill:#fff;stroke:#17745f;stroke-width:1.7}.ai{fill:#eef4fa;stroke:#6f99c5;stroke-width:1.7}.key{fill:#fff4ed;stroke:#f47c3c;stroke-width:2}.line{stroke:#17745f;stroke-width:2.2}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#17745f"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">七层可信问数机制</text><line x1="65" y1="105" x2="1535" y2="105" class="line"/><g><rect x="130" y="145" width="1340" height="75" rx="15" class="card"/><text x="165" y="178" class="h">1. L1 请求接入</text><text x="165" y="204" class="b">建立会话、请求、Trace与原始问题</text><rect x="175" y="240" width="1250" height="75" rx="15" class="ai"/><text x="210" y="273" class="h">2. L2 问题理解</text><text x="210" y="299" class="b">标准化问句，模型可受约束抽取意图与参数</text><rect x="220" y="335" width="1160" height="75" rx="15" class="card"/><text x="255" y="368" class="h">3. L3 意图参数</text><text x="255" y="394" class="b">识别指标、维度、机构、时间与缺参状态</text><rect x="265" y="430" width="1070" height="75" rx="15" class="card"/><text x="300" y="463" class="h">4. L4 语义计划</text><text x="300" y="489" class="b">形成查询计划，选择已发布业务资产</text><rect x="310" y="525" width="980" height="75" rx="15" class="card"/><text x="345" y="558" class="h">5. L5 资产映射</text><text x="345" y="584" class="b">映射指标、维度、表字段与受控SQL模板</text><rect x="355" y="620" width="890" height="75" rx="15" class="key"/><text x="390" y="653" class="h">6. L6 安全执行</text><text x="390" y="679" class="b">参数化SQL、AST校验、权限注入与数据源执行</text><rect x="400" y="715" width="800" height="75" rx="15" class="ai"/><text x="435" y="748" class="h">7. L7 事实回答</text><text x="435" y="774" class="b">仅根据真实执行结果生成文本、表格、图表与建议</text></g><g class="line"><line x1="800" y1="220" x2="800" y2="240" marker-end="url(#a)"/><line x1="800" y1="315" x2="800" y2="335" marker-end="url(#a)"/><line x1="800" y1="410" x2="800" y2="430" marker-end="url(#a)"/><line x1="800" y1="505" x2="800" y2="525" marker-end="url(#a)"/><line x1="800" y1="600" x2="800" y2="620" marker-end="url(#a)"/><line x1="800" y1="695" x2="800" y2="715" marker-end="url(#a)"/></g></svg>
