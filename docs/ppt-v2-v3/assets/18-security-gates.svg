<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.b{font-size:24px;fill:#5d687a}.card{fill:#fff;stroke:#17745f;stroke-width:1.7}.key{fill:#fff4ed;stroke:#f47c3c;stroke-width:2}.line{stroke:#17745f;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#17745f"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">六道安全可信门禁</text><line x1="65" y1="105" x2="1535" y2="105" stroke="#17745f" stroke-width="2"/><path d="M135 450H1465" class="line" marker-end="url(#a)"/><g><rect x="80" y="260" width="215" height="265" rx="18" class="card"/><circle cx="187" cy="320" r="32" fill="#17745f"/><text x="187" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">1</text><text x="187" y="385" text-anchor="middle" class="h">身份权限</text><text x="187" y="430" text-anchor="middle" class="b">角色与机构快照</text><text x="187" y="465" text-anchor="middle" class="b">拒绝优先</text><rect x="325" y="260" width="215" height="265" rx="18" class="card"/><circle cx="432" cy="320" r="32" fill="#17745f"/><text x="432" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">2</text><text x="432" y="385" text-anchor="middle" class="h">资产白名单</text><text x="432" y="430" text-anchor="middle" class="b">指标、表、字段</text><text x="432" y="465" text-anchor="middle" class="b">模板与发布版本</text><rect x="570" y="260" width="215" height="265" rx="18" class="key"/><circle cx="677" cy="320" r="32" fill="#f47c3c"/><text x="677" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">3</text><text x="677" y="385" text-anchor="middle" class="h">SQL安全</text><text x="677" y="430" text-anchor="middle" class="b">AST结构检查</text><text x="677" y="465" text-anchor="middle" class="b">只读、参数化</text><rect x="815" y="260" width="215" height="265" rx="18" class="card"/><circle cx="922" cy="320" r="32" fill="#17745f"/><text x="922" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">4</text><text x="922" y="385" text-anchor="middle" class="h">执行约束</text><text x="922" y="430" text-anchor="middle" class="b">时间、行数、扫描量</text><text x="922" y="465" text-anchor="middle" class="b">超时与取消</text><rect x="1060" y="260" width="215" height="265" rx="18" class="card"/><circle cx="1167" cy="320" r="32" fill="#17745f"/><text x="1167" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">5</text><text x="1167" y="385" text-anchor="middle" class="h">事实回答</text><text x="1167" y="430" text-anchor="middle" class="b">模型异常不伪造</text><text x="1167" y="465" text-anchor="middle" class="b">结果一致性校验</text><rect x="1305" y="260" width="215" height="265" rx="18" class="card"/><circle cx="1412" cy="320" r="32" fill="#17745f"/><text x="1412" y="329" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" fill="white">6</text><text x="1412" y="385" text-anchor="middle" class="h">追踪审计</text><text x="1412" y="430" text-anchor="middle" class="b">请求、SQL、Provider</text><text x="1412" y="465" text-anchor="middle" class="b">结果引用与保留</text></g><rect x="250" y="650" width="1100" height="90" rx="15" fill="#f2f8f6" stroke="#17745f"/><text x="800" y="705" text-anchor="middle" class="h">大模型在门禁内发挥理解与表达能力，不拥有企业数据治理权</text></svg>
