<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="65" font-family="Microsoft YaHei,微软雅黑,sans-serif" font-size="46" font-weight="700" fill="#182033">V3.0 七层规划架构</text>
  <text x="70" y="102" font-family="Microsoft YaHei,微软雅黑,sans-serif" font-size="24" fill="#667085">从单次可信问数，演进为领域能力驱动、可编排、证据化的智能分析体系</text>
  <rect x="70" y="130" width="1460" height="52" rx="14" fill="#EEF4FA" stroke="#5C91C8"/>
  <text x="800" y="163" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,sans-serif" font-size="24" font-weight="700" fill="#355F8B">入口：主动提问｜订阅预警｜智能报告｜分析智能体｜企业门户与 IM</text>

  <g font-family="Microsoft YaHei,微软雅黑,sans-serif">
    <g transform="translate(70,205)"><rect width="1460" height="72" rx="14" fill="#F2F8F6" stroke="#17745F" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#17745F"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L1</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">交互与任务接入层</text><text x="82" y="56" font-size="24" fill="#667085">接收对话、订阅、预警和智能体任务；绑定用户、会话、领域入口、展示级别及确认上下文</text></g>
    <g transform="translate(70,289)"><rect width="1460" height="72" rx="14" fill="#EEF4FA" stroke="#5C91C8" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#5C91C8"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L2</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">领域理解层</text><text x="82" y="56" font-size="24" fill="#667085">识别领域、能力、意图、参数和上下文；检测缺参、歧义及跨域需求，形成候选能力列表</text></g>
    <g transform="translate(70,373)"><rect width="1460" height="72" rx="14" fill="#F2F8F6" stroke="#17745F" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#17745F"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L3</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">语义规划层</text><text x="82" y="56" font-size="24" fill="#667085">统一指标口径，将综合问题拆成语义子任务，确定任务依赖、分析路径和完整性要求</text></g>
    <g transform="translate(70,457)"><rect width="1460" height="72" rx="14" fill="#EEF4FA" stroke="#5C91C8" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#5C91C8"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L4</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">可信资产匹配层</text><text x="82" y="56" font-size="24" fill="#667085">匹配经授权的指标、维度、表、字段、业务 API、文档或实时数据，校验时效与敏感等级</text></g>
    <g transform="translate(70,541)"><rect width="1460" height="72" rx="14" fill="#F2F8F6" stroke="#17745F" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#17745F"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L5</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">查询与任务编排层</text><text x="82" y="56" font-size="24" fill="#667085">生成版本化执行计划 DAG，绑定 SQL、API、计算或检索任务，定义失败策略和证据要求</text></g>
    <g transform="translate(70,625)"><rect width="1460" height="72" rx="14" fill="#EEF4FA" stroke="#5C91C8" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#5C91C8"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L6</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">执行与治理层</text><text x="82" y="56" font-size="24" fill="#667085">串并行调度，实施权限、安全、脱敏、限流、重试、取消、质量检查及部分成功判断</text></g>
    <g transform="translate(70,709)"><rect width="1460" height="72" rx="14" fill="#FFF4EC" stroke="#F47C3C" stroke-width="2"/><circle cx="38" cy="36" r="22" fill="#F47C3C"/><text x="38" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L7</text><text x="82" y="31" font-size="30" font-weight="700" fill="#182033">证据化分析与决策辅助层</text><text x="82" y="56" font-size="24" fill="#667085">基于成功结果生成结论、异常、归因、预测和图表；披露未核实项，提供证据与下一步建议</text></g>
  </g>
  <rect x="70" y="810" width="1460" height="50" rx="12" fill="#182033"/>
  <text x="800" y="842" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,sans-serif" font-size="24" fill="#fff">确定性边界：模型不裁决权限、不绕过安全、不创造未发布调用关系；业务写操作必须重新鉴权、确认或审批</text>
  <rect x="1360" y="42" width="170" height="38" rx="19" fill="#FFF4EC" stroke="#F47C3C"/>
  <text x="1445" y="67" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,sans-serif" font-size="24" font-weight="700" fill="#C95D25">V3.0 规划能力</text>
</svg>
