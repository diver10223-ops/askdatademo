<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.s{font-size:24px;fill:#667085}.h{font-size:30px;font-weight:bold}.b{font-size:24px}.sm{font-size:24px;fill:#667085}.line{stroke:#17745f;stroke-width:5}.c{fill:white;stroke:#17745f;stroke-width:2}.now{fill:#fff4ed;stroke:#f47c3c;stroke-width:3}</style><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">产品建设路径</text><text x="65" y="108" class="s">从基础问数能力走向企业平台，再演进为智能经营分析与决策协同</text><line x1="65" y1="135" x2="1535" y2="135" stroke="#17745f" stroke-width="2"/><line x1="235" y1="440" x2="1365" y2="440" class="line"/><circle cx="310" cy="440" r="25" fill="#5c91c8"/><circle cx="800" cy="440" r="32" fill="#f47c3c"/><circle cx="1290" cy="440" r="25" fill="#17745f"/><rect x="125" y="215" width="370" height="170" rx="16" class="c"/><text x="310" y="263" text-anchor="middle" class="h">V1.x｜基础能力</text><text x="160" y="310" class="b">标准演示 · 基础问数 · POC验证</text><text x="160" y="344" class="sm">形成三角色、八场景和七层执行雏形</text><rect x="615" y="195" width="370" height="190" rx="16" class="now"/><text x="800" y="245" text-anchor="middle" class="h">V2.0｜企业平台</text><text x="650" y="292" class="b">平台化 · 配置化 · 安全化 · 可运维</text><text x="650" y="326" class="sm">当前：产品基线收尾，客户适配待开展</text><rect x="1105" y="215" width="370" height="170" rx="16" class="c"/><text x="1290" y="263" text-anchor="middle" class="h">V3.0｜经营智能</text><text x="1140" y="310" class="b">主动发现 · 深度分析 · 决策协同</text><text x="1140" y="344" class="sm">智能体、归因预测、报告与生态开放</text><rect x="300" y="560" width="1000" height="105" rx="14" fill="#f2f8f6" stroke="#7fa9a0"/><text x="800" y="602" text-anchor="middle" class="h">演进原则</text><text x="800" y="638" text-anchor="middle" class="b">V2.0可信底座保持稳定｜V3.0按业务价值与数据成熟度分阶段试点</text></svg>
