<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.b{font-size:24px;fill:#566277}.card{fill:#fff;stroke:#17745f;stroke-width:1.8}.blue{fill:#eef4fa;stroke:#6f99c5;stroke-width:1.8}.key{fill:#fff4ed;stroke:#f47c3c;stroke-width:2}.line{stroke:#9cb2ad;stroke-width:2}</style><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">管理端核心能力</text><line x1="65" y1="105" x2="1535" y2="105" stroke="#17745f" stroke-width="2"/><circle cx="800" cy="465" r="150" fill="#f2f8f6" stroke="#17745f" stroke-width="3"/><text x="800" y="450" text-anchor="middle" class="h">统一管理事实源</text><text x="800" y="486" text-anchor="middle" class="b">配置 · 运行 · 审计</text><g class="line"><line x1="690" y1="365" x2="470" y2="245"/><line x1="800" y1="315" x2="800" y2="235"/><line x1="910" y1="365" x2="1130" y2="245"/><line x1="690" y1="565" x2="470" y2="685"/><line x1="800" y1="615" x2="800" y2="695"/><line x1="910" y1="565" x2="1130" y2="685"/></g><rect x="180" y="160" width="360" height="150" rx="18" class="card"/><text x="360" y="207" text-anchor="middle" class="h">组织、用户与权限</text><text x="360" y="250" text-anchor="middle" class="b">身份映射 · 角色 · 机构数据范围</text><rect x="620" y="140" width="360" height="150" rx="18" class="blue"/><text x="800" y="187" text-anchor="middle" class="h">数据资产与指标</text><text x="800" y="230" text-anchor="middle" class="b">表字段 · 指标维度 · 口径 · 血缘</text><rect x="1060" y="160" width="360" height="150" rx="18" class="card"/><text x="1240" y="207" text-anchor="middle" class="h">场景、流程与模板</text><text x="1240" y="250" text-anchor="middle" class="b">参数 · SQL模板 · 推荐 · 话术</text><rect x="180" y="620" width="360" height="150" rx="18" class="blue"/><text x="360" y="667" text-anchor="middle" class="h">模型、数据源与秘密</text><text x="360" y="710" text-anchor="middle" class="b">独立配置 · 诊断 · 启用 · 组合</text><rect x="620" y="640" width="360"