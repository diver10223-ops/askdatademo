<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.b{font-size:24px;fill:#5d687a}.num{font-size:24px;font-weight:bold;fill:white}.card{fill:white;stroke:#17745f;stroke-width:1.6}.alt{fill:#eef4fa;stroke:#6f99c5;stroke-width:1.6}.key{fill:#fff4ed;stroke:#f47c3c;stroke-width:2}.line{stroke:#17745f;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#17745f"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">客户实施与验收路径</text><line x1="65" y1="105" x2="1535" y2="105" stroke="#17745f" stroke-width="2"/><path d="M140 405H1460" class="line" marker-end="url(#a)"/><g><circle cx="170" cy="405" r="34" fill="#17745f"/><text x="170" y="413" text-anchor="middle" class="num">1</text><rect x="80" y="195" width="250" height="155" rx="15" class="card"/><text x="205" y="240" text-anchor="middle" class="h">调研与差距分析</text><text x="205" y="280" text-anchor="middle" class="b">业务、数据、环境、治理</text><text x="205" y="312" text-anchor="middle" class="b">输出：差距清单与范围</text><circle cx="420" cy="405" r="34" fill="#5c91c8"/><text x="420" y="413" text-anchor="middle" class="num">2</text><rect x="345" y="470" width="250" height="155" rx="15" class="alt"/><text x="470" y="515" text-anchor="middle" class="h">环境与适配设计</text><text x="470" y="555" text-anchor="middle" class="b">认证、网络、模型、数据库</text><text x="470" y="587" text-anchor="middle" class="b">输出：部署与适配方案</text><circle cx="670" cy="405" r="34" fill="#17745f"/><text x="670" y="413" text-anchor="middle" class="num">3</text><rect x="595" y="195" width="250" height="155" rx="15" class="card"/><text x="720" y="240" text-anchor="middle" class="h">资产权限配置</text><text x="720" y="280" text-anchor="middle" class="b">指标、场景、模板、权限</text><text x="720" y="312" text-anchor="middle" class="b">输出：可发布配置基线</text><circle cx="920" cy="405" r="34" fill="#f47c3c"/><text x="920" y="413" text-anchor="middle" class="num">4</text><rect x="845" y="470" width="250" height="155" rx="15" class="key"/><text x="970" y="515" text-anchor="middle" class="h">真实联调与对账</text><text x="970" y="555" text-anchor="middle" class="b">黄金问题、源库SQL、异常</text><text x="970" y="587" text-anchor="middle" class="b">输出：联调与对账报告</text><circle cx="1170" cy="405" r="34" fill="#17745f"/><text x="1170" y="413" text-anchor="middle" class="num">5</text><rect x="1095" y="195" width="250" height="155" rx="15" class="card"/><text x="1220" y="240" text-anchor="middle" class="h">试运行与专项验证</text><text x="1220" y="280" text-anchor="middle" class="b">容量、安全、灾备、SLA</text><text x="1220" y="312" text-anchor="middle" class="b">输出：专项验证证据</text><circle cx="1420" cy="405" r="34" fill="#5c91c8"/><text x="1420" y="413" text-anchor="middle" class="num">6</text><rect x="1270" y="470" width="250" height="155" rx="15" class="alt"/><text x="1395" y="515" text-anchor="middle" class="h">验收上线与回滚</text><text x="1395" y="555" text-anchor="middle" class="b">业务签字、窗口、观察指标</text><text x="1395" y="587" text-anchor="middle" class="b">输出：交付签收与记录</text></g><rect x="250" y="700" width="1100" height="75" rx="15" fill="#f2f8f6" stroke="#17745f"/><text x="800" y="747" text-anchor="middle" class="h">产品基线证据不能替代客户真实环境、业务口径和生产SLA验收</text></svg>
