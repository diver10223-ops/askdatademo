<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>text{font-family:Microsoft YaHei,"微软雅黑",sans-serif;fill:#182033}.t{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.b{font-size:24px;fill:#566277}.num{font-size:24px;font-weight:bold;fill:white}.card{fill:white;stroke:#17745f;stroke-width:1.6}.alt{fill:#eef4fa;stroke:#6f99c5;stroke-width:1.6}</style><rect width="1600" height="900" fill="white"/><text x="65" y="75" class="t">八类标准业务场景</text><line x1="65" y1="105" x2="1535" y2="105" stroke="#17745f" stroke-width="2"/><g><rect x="80" y="155" width="340" height="235" rx="18" class="card"/><circle cx="125" cy="200" r="25" fill="#17745f"/><text x="125" y="207" text-anchor="middle" class="num">01</text><text x="165" y="207" class="h">基础指标查询</text><text x="110" y="255" class="b">例：本月各分行贷款投放是多少？</text><text x="110" y="295" class="b">输出：结论、结果表格、SQL记录</text><rect x="450" y="155" width="340" height="235" rx="18" class="alt"/><circle cx="495" cy="200" r="25" fill="#5c91c8"/><text x="495" y="207" text-anchor="middle" class="num">02</text><text x="535" y="207" class="h">驾驶舱导航</text><text x="480" y="255" class="b">例：打开我有权限的经营驾驶舱</text><text x="480" y="295" class="b">输出：角色过滤后的导航入口</text><rect x="820" y="155" width="340" height="235" rx="18" class="card"/><circle cx="865" cy="200" r="25" fill="#17745f"/><text x="865" y="207" text-anchor="middle" class="num">03</text><text x="905" y="207" class="h">同比环比趋势</text><text x="850" y="255" class="b">例：零售贷款同比变化如何？</text><text x="850" y="295" class="b">输出：趋势图、同比值、业务结论</text><rect x="1190" y="155" width="340" height="235" rx="18" class="alt"/><circle cx="1235" cy="200" r="25" fill="#5c91c8"/><text x="1235" y="207" text-anchor="middle" class="num">04</text><text x="1275" y="207" class="h">机构排名对比</text><text x="1220" y="255" class="b">例：哪些分行新增客户排名靠前？</text><text x="1220" y="295" class="b">输出：排名、横向对比与建议追问</text><rect x="80" y="435" width="340" height="235" rx="18" class="alt"/><circle cx="125" cy="480" r="25" fill="#5c91c8"/><text x="125" y="487" text-anchor="middle" class="num">05</text><text x="165" y="487" class="h">多指标组合</text><text x="110" y="535" class="b">例：同时看贷款、存款与客户数</text><text x="110" y="575" class="b">输出：多指标结果与组合图表</text><rect x="450" y="435" width="340" height="235" rx="18" class="card"/><circle cx="495" cy="480" r="25" fill="#17745f"/><text x="495" y="487" text-anchor="middle" class="num">06</text><text x="535" y="487" class="h">业务明细下钻</text><text x="480" y="535" class="b">例：下钻到分行、机构或客户明细</text><text x="480" y="575" class="b">输出：受权限约束的明细数据</text><rect x="820" y="435" width="340" height="235" rx="18" class="alt"/><circle cx="865" cy="480" r="25" fill="#5c91c8"/><text x="865" y="487" text-anchor="middle" class="num">07</text><text x="905" y="487" class="h">缺参补充引导</text><text x="850" y="535" class="b">例：未说明时间或机构时先确认</text><text x="850" y="575" class="b">输出：选项、推荐参数与继续提问</text><rect x="1190" y="435" width="340" height="235" rx="18" fill="#fff4ed" stroke="#f47c3c" stroke-width="1.8"/><circle cx="1235" cy="480" r="25" fill="#f47c3c"/><text x="1235" y="487" text-anchor="middle" class="num">08</text><text x="1275" y="487" class="h">权限与异常处理</text><text x="1220" y="535" class="b">例：越权、模型或数据源异常</text><text x="1220" y="575" class="b">输出：明确终态、原因和处理建议</text></g><text x="800" y="780" text-anchor="middle" class="h">标准场景可通过指标、维度、模板与话术配置扩展为客户行业场景</text></svg>
