spring:
  application:
    name: askdata-platform
  datasource:
    url: ${ASKDATA_PLATFORM_DB_URL:jdbc:h2:file:./data/platform-v2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${ASKDATA_PLATFORM_DB_USERNAME:askdata}
    password: ${ASKDATA_PLATFORM_DB_PASSWORD:askdata-local-only}
  flyway:
    enabled: true
    validate-migration-naming: true
    url: ${ASKDATA_MIGRATION_DB_URL:${ASKDATA_PLATFORM_DB_URL:jdbc:h2:file:./data/platform-v2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}}
    user: ${ASKDATA_MIGRATION_DB_USERNAME:${ASKDATA_PLATFORM_DB_USERNAME:askdata}}
    password: ${ASKDATA_MIGRATION_DB_PASSWORD:${ASKDATA_PLATFORM_DB_PASSWORD:askdata-local-only}}
  h2:
    console:
      enabled: false

server:
  port: ${ASKDATA_PLATFORM_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: AskData Platform
    version: 2.0.0-SNAPSHOT

askdata:
  execution:
    base-url: ${ASKDATA_EXECUTION_BASE_URL:http://127.0.0.1:8000}
    service-token: ${ASKDATA_INTERNAL_SERVICE_TOKEN:askdata-local-service-token}

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"askdata-platform","traceId":"%X{traceId:-}","logger":"%logger{36}","message":"%replace(%m){''[\r\n]+'','' ''}"}%n'
